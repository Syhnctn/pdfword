name: pdfword_pro
description: PDF to Word Pro mobile UI prototype built with Flutter.
publish_to: "none"
version: 0.1.9+20260925

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  archive: ^4.0.9
  cupertino_icons: ^1.0.8
  dotted_border: ^2.1.0
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.0.10+1
  file_picker: ^8.3.5
  go_router: ^14.8.1
  google_fonts: ^6.2.1
  google_mobile_ads: ^5.3.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.4
  supabase_flutter: ^2.9.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  open_filex: ^4.7.0

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  golden_toolkit: ^0.15.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/mock/converted_sample.docx

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon_launcher.png
  adaptive_icon_background: "#123ED6"
  adaptive_icon_foreground: assets/images/app_icon_foreground.png
  remove_alpha_ios: true

flutter_native_splash:
  color: "#123ED6"
  image: assets/images/app_splash_icon.png
  fullscreen: true
  android_12:
    color: "#123ED6"
    image: assets/images/app_splash_icon.png
